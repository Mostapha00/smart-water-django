{% extends "base.html" %}
{% block title %}Connexion · AquaMind{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-sm-8 col-md-5">
  <h1 class="h3 mb-3">Connexion</h1>
  {% if form.errors %}<div class="alert alert-danger">Identifiant ou mot de passe incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label" for="id_username">Identifiant</label><input class="form-control" name="username" id="id_username" autofocus required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Mot de passe</label><input class="form-control" type="password" name="password" id="id_password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary">Se connecter</button>
  </form>
</div></div>
{% endblock %}
