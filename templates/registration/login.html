{% extends "base.html" %}
{% block title %}Connexion · AquaMind{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-sm-8 col-md-5">
  <h1 class="h3 mb-3">Connexion</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "registration/_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Se connecter</button>
  </form>
  <p class="mt-3 small text-body-secondary">Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
</div></div>
{% endblock %}
