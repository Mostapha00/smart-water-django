{% if form.non_field_errors %}<div class="alert alert-danger">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
{% for field in form %}
<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text small">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
