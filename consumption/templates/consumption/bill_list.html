{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Factures</h1><a class="btn btn-primary" href="{% url 'consumption:bill_create' %}">Nouvelle facture</a></div><table class="table"><tr><th>Compteur</th><th>Période</th><th>Volume</th><th>Total</th></tr>{% for bill in bills %}<tr><td>{{ bill.meter }}</td><td>{{ bill.period_start }} → {{ bill.period_end }}</td><td>{{ bill.volume_m3 }} m³</td><td>{{ bill.total_amount_tnd }} TND</td></tr>{% endfor %}</table>{% endblock %}
