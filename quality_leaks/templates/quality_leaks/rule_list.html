{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Règles d'alerte</h1><a class="btn btn-primary" href="{% url 'quality_leaks:rule_create' %}">Nouvelle règle</a></div><table class="table"><tr><th>Nom</th><th>Paramètre</th><th>Condition</th><th>Sévérité</th><th>Active</th></tr>{% for rule in rules %}<tr><td>{{ rule.name }}</td><td>{{ rule.parameter }}</td><td>{{ rule.operator }} {{ rule.threshold }}</td><td>{{ rule.severity }}</td><td>{{ rule.active|yesno:"Oui,Non" }}</td></tr>{% endfor %}</table>{% endblock %}
