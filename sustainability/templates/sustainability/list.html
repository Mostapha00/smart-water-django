{% extends "base.html" %}
{% block content %}<h1>{{ page_title|default:"Enregistrements" }}</h1><a class="btn btn-primary mb-3" href="{{ create_url|default:"#" }}">Nouveau</a><div class="list-group">{% for object in objects %}<a class="list-group-item list-group-item-action" href="{{ object.get_absolute_url }}">{{ object }}</a>{% empty %}<p class="text-muted">Aucun enregistrement.</p>{% endfor %}</div>{% endblock %}
