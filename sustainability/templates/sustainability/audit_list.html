{% extends "base.html" %}
{% block content %}<div class="d-flex justify-content-between align-items-center"><h1>Audits archivés</h1><a class="btn btn-primary" href="{% url 'sustainability:audit_report' %}">Générer un audit</a></div><div class="list-group mt-3">{% for report in reports %}<a class="list-group-item list-group-item-action" href="{% url 'sustainability:audit_pdf' report.pk %}">Audit {{ report.period_start }} – {{ report.period_end }} · {{ report.site|default:"Tous les sites" }}</a>{% empty %}<p class="text-muted">Aucun audit archivé.</p>{% endfor %}</div>{% endblock %}
